version: 2

updates:
  # Yarn workspaces (root, package/, example/) are resolved from the root lockfile
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # GitHub bypasses cooldowns for known vulnerability fixes
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      react-native:
        patterns:
          - "react-native"
          - "react-native-*"
          - "@react-native/*"
          - "@react-native-community/*"
      lint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@stylistic/*"
          - "typescript-eslint"
      babel:
        patterns:
          - "@babel/*"
    ignore:
      # RN 0.87 breaks the test setup: react-native-testing-mocks 1.7.0 can't
      # mock native modules before InitializeCore runs. Upgrade RN manually
      # (with upgrade-helper) once the mocks support it.
      - dependency-name: "react-native"
        versions: [">= 0.87.0"]
      - dependency-name: "@react-native/*"
        versions: [">= 0.87.0"]

  - package-ecosystem: bundler
    directory: /example
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7

  - package-ecosystem: gradle
    directory: /example/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    ignore:
      # The RN template dictates the wrapper version; bump it with RN upgrades
      - dependency-name: "gradle-wrapper"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      actions:
        patterns:
          - "*"
